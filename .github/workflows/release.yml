name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build electron app
        run: bun run build:electron

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/electron/release/Excalidesk.dmg
          draft: false
          prerelease: false
